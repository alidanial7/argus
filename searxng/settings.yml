# SearXNG settings — see https://docs.searxng.org/admin/settings/settings.html
# `disabled: true` still loads/inits engines; use remove to skip them entirely.
use_default_settings:
  engines:
    remove:
      - wikidata   # SPARQL endpoint often returns HTTP 403
      - ahmia      # optional/onion; fails to load in many images
      - torch      # optional/onion; fails to load in many images

general:
  instance_name: "Argus Search"
  debug: false
  enable_metrics: false

server:
  # Change this to a long random string (must match your deployment secrets)
  secret_key: "ultrasecretkey-change-me-in-production"
  limiter: false
  image_proxy: true
  port: 8080
  bind_address: "0.0.0.0"
  public_instance: false
  method: "GET"

search:
  safe_search: 0
  autocomplete: "duckduckgo"
  default_lang: "en"
  formats:
    - html
    - json

ui:
  static_use_hash: true
  default_theme: simple
  theme_args:
    simple_style: auto

engines:
  - name: duckduckgo
    disabled: false
  - name: google
    disabled: false
  - name: bing
    disabled: false
  - name: wikipedia
    disabled: false
  - name: github
    disabled: false
